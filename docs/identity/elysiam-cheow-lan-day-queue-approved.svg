<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Elysiam — Чео Лан и Самет Нангше</title><desc id="desc">Единый реальный сюжет озера Чео Лан: три известняковых массива Гуйлинь и небольшая лодка longtail. Самет Нангше указан в названии программы, но морской залив не примешан к озёрному пейзажу.</desc>
