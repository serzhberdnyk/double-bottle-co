<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Elysiam — Сафари в Као Лаке</title><desc id="desc">Спокойная лесная река, бамбуковый плот с двумя пассажирами и проводником. Форма плота и характер среды проверены по фото местного оператора; точное место и конкретный поставщик не заявлены.</desc>
