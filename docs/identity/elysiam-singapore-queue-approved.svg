<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Elysiam — Сингапур из Пхукета</title><desc id="desc">Проверенная остановка Jewel Changi: стеклянный сетчатый купол, Rain Vortex и внутренний лес. Ручная векторная иллюстрация, без добавления неуказанных городских остановок.</desc>
