<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Elysiam — Рассвет на Пхи-Пхи</title><desc id="desc">Ручная геометрическая иллюстрация Майя Бэй: вид с песчаного пляжа на скальный проход. Эмблема восхода в заголовке обозначает ранний морской выход и не помещена в пейзаж бухты.</desc>
