<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img"><title>Elysiam — Пхи-Пхи, Кхай и Майтон</title><desc>Два отдельных геометрических кадра: лагуна Пиле и низкий лесистый каменистый берег Майтон. Маска — отдельная эмблема снорклинга. География основана на фотографиях; не единая панорама. Для согласования.</desc>
