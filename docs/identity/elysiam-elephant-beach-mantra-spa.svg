<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Elysiam — Elephant Beach и Mantra Spa</title><desc id="desc">Геометрический туристический ретроплакат: азиатский слон спокойно стоит у песчаного берега, на заднем плане море и низкие острова, внизу декоративный лотос. Без сцен катания, кормления или купания со слонами.</desc>
