<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img"><title>Elysiam — Пханг Нга и пляж с самолётами</title><desc>Отдельные кадры панорамы залива Пханг Нга и пляжа Май Кхао с символическим немаркированным самолётом. Места не объединены в одну панораму. Skywalk не изображён как обязательный для обоих вариантов. Для согласования.</desc>
