<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Elysiam — Рассвет на Самет Нангше</title><desc id="desc">Панорама с высоты Самет Нангше: мангровые леса, извилистые протоки и реальные типы известняковых островов залива Пханг Нга. Утренние цвета переданы условно. Стеклянный Skywalk не изображён как включённый в базовую программу.</desc>
