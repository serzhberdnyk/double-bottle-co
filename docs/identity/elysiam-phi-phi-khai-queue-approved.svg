<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img"><title>Elysiam — Пхи-Пхи и Кхай</title><desc>Самостоятельная ручная векторная композиция скального островка в Ло Сама: округлый зелёный известняковый массив с подмытым основанием. Ло Сама присутствует в программе. Это один реальный мотив маршрута, без вымышленного объединения с островами Кхай. Для согласования.</desc>
