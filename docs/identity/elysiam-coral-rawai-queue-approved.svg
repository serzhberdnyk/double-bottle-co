<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Elysiam — Корал с пирса Раваи</title><desc id="desc">Берег острова Корал: низкие зелёные холмы, длинная полоса светлого песка и бирюзовое мелководье. Ручная векторная иллюстрация по природным формам острова; конкретный пляжный клуб, пристань или модель судна не заявлены.</desc>
