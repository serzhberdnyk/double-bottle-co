<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Double Bottle Co — Краби и закат на островах</title><desc id="desc">Два самостоятельных комикс-кадра: бухта острова Лао Ладинг и песчаная коса Ко Пэ в вечернем свете. Ручная векторная иллюстрация по фотографиям реальных мест, не единая панорама. Вариант для согласования.</desc>
