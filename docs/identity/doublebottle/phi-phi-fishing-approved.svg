<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Double Bottle Co — Пхи-Пхи, Бамбу и рыбалка</title><desc id="desc">Два отдельных комикс-кадра: белая песчаная коса Бамбу по фотографии TAT и символический эпизод морской рыбалки. Рыбалка зависит от погоды. Ручной векторный рисунок для согласования.</desc>
