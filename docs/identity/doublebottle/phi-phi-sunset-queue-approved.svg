<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>Double Bottle Co — Пхи-Пхи и закат у Майтона</title><desc>Ручная геометрическая иллюстрация прозрачного каяка у низкого каменистого берега Майтон. Один взрослый в спасательном жилете. Закат обозначен отдельным знаком в заголовке, без утверждения положения солнца у конкретной бухты. Для согласования.</desc>
