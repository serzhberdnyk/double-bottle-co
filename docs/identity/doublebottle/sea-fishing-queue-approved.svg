<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Double Bottle Co — Морская рыбалка на рассвете</title><desc id="desc">Условное рыболовное судно с удочками в открытом море. Отдельная эмблема рассвета. Улов не изображён и не гарантируется. Ручная векторная иллюстрация.</desc>
