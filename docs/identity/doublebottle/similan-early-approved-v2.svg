<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Double Bottle Co — Симиланы. Пляжи и снорклинг</title>
<desc id="desc">Самостоятельная ручная векторная композиция, вид бухты сверху: белая дуга пляжа, гранитный берег, тропическая зелень и пловец с маской и ластами в бирюзовой воде. Иллюстрация общего характера, без обещания конкретной точки маршрута. Вариант 2 для согласования.</desc>
