<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Double Bottle Co — Куала-Лумпур из Пхукета</title><desc id="desc">Проверенный пункт программы: две башни Петронас с многоярусными шпилями и соединяющим мостом. Ручной векторный рисунок по фотографиям реального здания; вход на мост или смотровую не обещается.</desc>
