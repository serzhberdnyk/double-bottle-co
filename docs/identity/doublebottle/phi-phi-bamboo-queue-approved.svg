<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>Double Bottle Co — Пхи-Пхи и остров Бамбу</title><desc>Ручной геометрический вид Бамбу с воды: длинный низкий остров с плотным лесом, тонкая светлая полоса песка и широкая бирюзовая вода. Без вымышленных скал, пальмового атолла или построек. Для согласования.</desc>
