<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Пхи-Пхи на катамаране — Double Bottle Co</title>
<desc id="desc">Авторский векторный туристический плакат. Двухпалубный катамаран с двумя корпусами идёт к зрителю по бирюзовой воде на фоне условных тропических скал. Крупная рубленая типографика, плоскости ярких красок и диагональная композиция.</desc>
