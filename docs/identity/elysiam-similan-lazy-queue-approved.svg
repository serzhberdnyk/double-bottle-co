<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img"><title>Elysiam — Симиланы без раннего подъёма</title><desc>Ручной геометрический рисунок Sail Rock на острове № 8: наклонный парусообразный гранитный валун на скальном основании, зелёный берег и белый пляж. Без изображения конкретного судна или вида транспорта. Только для согласования.</desc>
